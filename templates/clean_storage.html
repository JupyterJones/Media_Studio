<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Selection</title>
    <style>
        body {
            background-color: #2c2c2c;
            color: #f5f5f5;
            font-family: Arial, sans-serif;
            margin: 20px;
            text-align: center!important;
        }
        .image-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center
        }
        .image-box {
            margin: 10px;
            text-align: center;
        }
        img {
            max-width: 300px;
            max-height: 400px;
            display: block;
            margin-bottom: 5px;
            border-radius: 8px;
        }
        .btn-submit {
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #4CAF50;
            border: none;
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }
        .btn-submit:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>

    <h1>Select Images to Remove</h1>
    <a style="font-size: 30px;color: chocolate;" href="{{ url_for('index') }}">Back to Home</a>
    <p>Check the images you want to remove from the storage.</p>
    <form method="POST" action="{{ url_for('clean_storage_route') }}">
        <div style="margin: 15px auto; max-width: 800px; display: flex; justify-content: center; align-items: center; gap: 12px; flex-wrap: wrap;">
            <button type="button" id="selectAllBtn" class="btn-submit" onclick="toggleSelectAll()" style="margin: 0; background-color: #2563eb;">☑️ Select All</button>
            <button type="button" class="btn-submit" onclick="deselectAll()" style="margin: 0; background-color: #64748b;">⬜ Deselect All</button>
            <span id="selectedCountBadge" style="font-size: 15px; font-weight: bold; color: #facc15; padding: 6px 12px; background: rgba(0,0,0,0.3); border-radius: 6px;">0 selected</span>
            <button type="submit" class="btn-submit" style="margin: 0; background-color: #dc2626;">🗑️ Remove Selected Images</button>
        </div>

        <div class="image-container">
            {% for image in images %}
            <div class="image-box" style="padding: 6px; border-radius: 8px; border: 2px solid transparent;">
                <label style="cursor: pointer; display: block;">
                    <img src="{{ url_for('static', filename='archived-store/' + image) }}" alt="{{ image }}">
                    <input type="checkbox" name="selected_images" value="{{ image }}" onchange="updateSelectedCount()" style="width: 22px; height: 22px; cursor: pointer;">
                </label>
            </div>
            {% endfor %}
        </div>
        <div style="margin: 25px 0;">
            <button type="button" class="btn-submit" onclick="toggleSelectAll()" style="background-color: #2563eb;">☑️ Select / Deselect All</button>
            <button type="submit" class="btn-submit" style="background-color: #dc2626;">🗑️ Remove Selected Images</button>
        </div>
    </form>

    <script>
    function updateSelectedCount() {
        const allCbs = document.querySelectorAll('input[name="selected_images"]');
        const checkedCbs = document.querySelectorAll('input[name="selected_images"]:checked');
        const countBadge = document.getElementById('selectedCountBadge');
        const selectAllBtn = document.getElementById('selectAllBtn');
        if (countBadge) countBadge.innerText = `${checkedCbs.length} of ${allCbs.length} selected`;
        if (selectAllBtn) selectAllBtn.innerHTML = (checkedCbs.length === allCbs.length && allCbs.length > 0) ? "⬜ Deselect All" : "☑️ Select All";

        allCbs.forEach(cb => {
            const card = cb.closest('.image-box');
            if (card) {
                card.style.borderColor = cb.checked ? "#facc15" : "transparent";
                card.style.backgroundColor = cb.checked ? "rgba(250, 204, 21, 0.12)" : "transparent";
            }
        });
    }

    function toggleSelectAll() {
        const allCbs = document.querySelectorAll('input[name="selected_images"]');
        const anyUnchecked = Array.from(allCbs).some(cb => !cb.checked);
        allCbs.forEach(cb => { cb.checked = anyUnchecked; });
        updateSelectedCount();
    }

    function deselectAll() {
        const allCbs = document.querySelectorAll('input[name="selected_images"]');
        allCbs.forEach(cb => { cb.checked = false; });
        updateSelectedCount();
    }

    document.addEventListener("DOMContentLoaded", updateSelectedCount);
    </script>
</body>
</html>
