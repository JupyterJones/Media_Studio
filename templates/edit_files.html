<!-- edit_files.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit File - {{ filename }}</title>
    <style>
        body {
            background-color: #111;
            color: #eee;
            font-family: Arial, Helvetica, sans-serif;
            padding: 30px;
        }

        h1 {
            color: #66ccff;
            margin-bottom: 10px;
        }

        textarea {
            width: 100%;
            height: 70vh;
            background-color: #1e1e1e;
            color: #eaeaea;
            border: 1px solid #444;
            border-radius: 6px;
            padding: 15px;
            font-family: monospace;
            font-size: 14px;
            resize: vertical;
        }

        .buttons {
            margin-top: 20px;
        }

        button {
            background-color: #66ccff;
            color: #000;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            margin-right: 15px;
        }

        button:hover {
            background-color: #88ddff;
        }

        a {
            color: #66ccff;
            text-decoration: none;
            font-size: 16px;
        }

        a:hover {
            text-decoration: underline;
        }

        .filename {
            color: #aaa;
            margin-bottom: 15px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <h1>Edit File</h1>
        <a href="/">HOME</a>
    <div class="filename">{{ filename }}</div>

    <form method="POST" action="/edit_files?filename={{ filename }}">
        <textarea name="content">{{ content }}</textarea>

        <div class="buttons">
            <button type="submit">Save & Download</button>
            <a href="/">HOME</a>
        </div>
    </form>

</body>
</html>
