<style>
  .video-gallery {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 20px;
    padding: 10px 0;
    margin: 0;
  }
  .video-gallery figure {
    background: var(--bg-card, rgba(18, 18, 35, 0.75));
    border: 1px solid var(--border-color, rgba(255, 255, 255, 0.12));
    border-radius: var(--radius, 10px);
    padding: 14px;
    margin: 0;
    text-align: center;
    transition: all var(--transition-speed, 0.25s);
    box-shadow: var(--shadow, 0 4px 16px rgba(0, 0, 0, 0.4));
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
  }
  .video-gallery figure:hover {
    transform: translateY(-3px);
    border-color: var(--accent-primary, #00f0ff);
    box-shadow: 0 8px 24px var(--accent-glow, rgba(0, 240, 255, 0.25));
  }
  .video-gallery video {
    width: 100%;
    max-height: 220px;
    border-radius: var(--radius-sm, 6px);
    background: #000;
  }
  .video-gallery figcaption {
    margin-top: 12px;
    font-size: 0.95rem;
    color: var(--text-muted, #8a8fba);
    width: 100%;
    line-height: 1.5;
  }
  .video-gallery .button {
    display: inline-block;
    margin-top: 8px;
    padding: 8px 16px;
    font-size: 0.92rem;
    font-weight: 600;
    font-family: inherit;
    color: #080812;
    background: var(--accent-gradient, linear-gradient(135deg, #00f0ff 0%, #b800ff 100%));
    border: none;
    border-radius: var(--radius-sm, 6px);
    text-decoration: none;
    cursor: pointer;
    transition: all var(--transition-speed, 0.25s);
    box-shadow: var(--shadow-glow, 0 2px 10px rgba(0, 240, 255, 0.3));
  }
  .video-gallery .button:hover {
    filter: brightness(1.15);
    transform: translateY(-1px);
    color: #000;
  }
  .video-gallery .round {
    display: inline-block;
    padding: 8px 14px;
    font-size: 0.85rem;
    color: #fff;
    background: var(--accent-secondary, #b800ff);
    border: 1px solid var(--border-color, rgba(255, 255, 255, 0.2));
    border-radius: 20px;
    text-decoration: none;
  }
  .video-gallery .responsive-img {
    width: 100%;
    max-width: 256px;
    height: auto;
    object-fit: cover;
    display: block;
    border-radius: var(--radius-sm, 6px);
  }
  img {
    width: 300px;
   height: auto;
   }
</style>
 <script>
    function confirmAction(event, url) {
        // Prevent the default link action
        event.preventDefault();
        
        // Show a confirmation dialog
        const userConfirmed = confirm("Are you sure you want to proceed?");
        
        // If the user confirmed, navigate to the link
        if (userConfirmed) {
            window.location.href = url;
        }
    }
</script>
