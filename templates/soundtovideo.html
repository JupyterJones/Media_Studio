<!-- soundtovideo.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sound to Video | Media Studio</title>
    <link rel="stylesheet" href="/static/css/themed.css">
    <link rel="stylesheet" href="/static/css/dark.css">
    <link rel="icon" href="/favicon.ico?v=1">
    <script src="/static/js/theme.js"></script>

    <style>
        .container {
            max-width: 1400px;
            margin: 20px auto;
            padding: 24px;
        }

        .header-nav {
            display: flex;
            gap: 12px;
            align-items: center;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .header-nav a {
            text-decoration: none;
        }

        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin: 15px 0 35px;
        }

        .video-card {
            background: var(--bg-card, rgba(18, 18, 35, 0.75));
            border: 1px solid var(--border-color, rgba(255, 255, 255, 0.12));
            border-radius: var(--radius-sm, 8px);
            padding: 12px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: all 0.2s ease;
        }

        .video-card:hover {
            border-color: var(--accent-primary, #00f0ff);
            box-shadow: 0 4px 18px var(--accent-glow, rgba(0, 240, 255, 0.25));
            transform: translateY(-2px);
        }

        .video-card:has(input[type="radio"]:checked) {
            border-color: var(--accent-primary, #00f0ff);
            background: rgba(0, 240, 255, 0.08);
            box-shadow: 0 0 18px rgba(0, 240, 255, 0.35);
        }

        .video-card label {
            width: 100%;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .card-radio-wrap {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
            margin-bottom: 4px;
        }

        .card-radio-wrap input[type="radio"] {
            accent-color: var(--accent-primary, #00f0ff);
            transform: scale(1.2);
            cursor: pointer;
        }

        .media-label {
            font-size: 0.88rem;
            font-weight: 600;
            color: var(--text-bright, #fff);
            word-break: break-all;
        }

        .video-card video {
            width: 300px;
            max-width: 100%;
            height: auto;
            border-radius: 6px;
            background: #000;
            display: block;
        }

        .audio-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 14px;
            margin: 15px 0 30px;
        }

        .audio-card {
            background: var(--bg-card, rgba(18, 18, 35, 0.75));
            border: 1px solid var(--border-color, rgba(255, 255, 255, 0.12));
            border-radius: 6px;
            padding: 12px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .audio-card:hover {
            border-color: var(--accent-primary, #00f0ff);
        }

        .audio-card:has(input[type="radio"]:checked) {
            border-color: var(--accent-primary, #00f0ff);
            background: rgba(0, 240, 255, 0.08);
            box-shadow: 0 0 12px rgba(0, 240, 255, 0.3);
        }

        .audio-label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            color: var(--text-bright, #fff);
            word-break: break-all;
        }

        .audio-label input[type="radio"] {
            accent-color: var(--accent-primary, #00f0ff);
            transform: scale(1.15);
            cursor: pointer;
        }

        .audio-player-wrap {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .btn-preview {
            padding: 5px 12px;
            font-size: 0.8rem;
            border-radius: 4px;
            border: 1px solid var(--border-color, rgba(255, 255, 255, 0.2));
            background: rgba(255, 255, 255, 0.06);
            color: var(--accent-primary, #00f0ff);
            cursor: pointer;
            align-self: flex-start;
            transition: all 0.2s;
        }

        .btn-preview:hover {
            background: var(--accent-primary, #00f0ff);
            color: #000;
        }

        .btn-create {
            padding: 12px 28px;
            font-size: 1.1rem;
            font-weight: 700;
            border-radius: var(--radius-sm, 6px);
            cursor: pointer;
            border: none;
            background: var(--accent-gradient, linear-gradient(135deg, #00f0ff 0%, #b800ff 100%));
            color: #080812;
            box-shadow: var(--shadow-glow, 0 2px 10px rgba(0, 240, 255, 0.3));
            transition: all 0.2s ease;
        }

        .btn-create:hover {
            filter: brightness(1.15);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-nav">
        <a href="/"><button type="button" class="btn">🏠 Home Dashboard</button></a>
        <a href="/mk_videos"><button type="button" class="btn">🎬 Video Processing</button></a>
        <a href="/upload_media"><button type="button" class="btn">🎭 Avatar Studio</button></a>
        <a href="/remember" target="remember_app"><button type="button" class="btn">💾 Remember DB</button></a>
        <a href="/effects" target="effects_studio"><button type="button" class="btn">🪄 Effects Studio</button></a>
    </div>

    <h1>🎵 Add Sound to Video</h1>
    <p style="color: var(--text-muted); margin-bottom: 24px;">Select a video and soundtrack to merge with FFmpeg / MoviePy.</p>

    <form id="video-audio-form" action="/combine" method="POST">
        <h2>Select a Video</h2>
        <div class="media-container video-grid">
            {% for video in videos %}
                <div class="media-item video-card">
                    <label>
                        <div class="card-radio-wrap">
                            <input type="radio" name="video" value="{{ video }}">
                            <span class="media-label">{{ video[:-4] }}</span>
                        </div>
                        <video width="300" height="auto" controls preload="metadata">
                            <source src="/static/temp_exp/{{ video }}" type="video/mp4">
                            Your browser does not support the video tag.
                        </video>
                    </label>
                </div>
            {% endfor %}
        </div>

        <h2>Preview and Select an Audio</h2>
        <div class="media-container audio-grid">
            {% for audio in audios %}
                <div class="media-item audio-card">
                    <label class="audio-label">
                        <input type="radio" name="audio" value="{{ audio }}">
                        <span class="audio-name">{{ audio[:-4] if audio.endswith('.mp3') else audio }}</span>
                    </label>
                    <div class="audio-player-wrap">
                        <button type="button" class="btn-preview" onclick="playAudio('{{ audio }}')">▶ Preview</button>
                        <audio id="audio_{{ audio }}" controls style="display: none; width: 100%; margin-top: 6px;">
                            <source src="/static/mp3/{{ audio }}" type="audio/mpeg">
                            Your browser does not support the audio element.
                        </audio>
                    </div>
                </div>
            {% endfor %}
        </div>

        <!-- Create Video button -->
        <div style="margin: 30px 0;">
            <button type="button" id="create-video" class="btn-create">⚡ Create Video</button>
        </div>
    </form>

    <h2>Output Video</h2>
    <div id="output-video-section" style="margin: 15px 0;"></div>

    <div style="margin-top: 35px; border-top: 1px solid var(--border-color, rgba(255,255,255,0.1)); padding-top: 20px;">
        <h3>Latest Combined Video:</h3>
        <video width="300" height="auto" controls style="border-radius: 6px; border: 1px solid var(--border-color); background: #000;">
            <source src="/static/temp_exp/text2videoX.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
    </div>
</div>

<button class="theme-switch-btn" onclick="toggleTheme()">
    🎨 <span id="themeName">Theme</span>
</button>

<script>
    // Function to play the selected MP3
    function playAudio(audioFile) {
        const audioElement = document.getElementById(`audio_${audioFile}`);
        
        // Stop any other audio that's currently playing
        const audios = document.querySelectorAll('audio');
        audios.forEach(audio => {
            if (!audio.paused) {
                audio.pause();
                audio.currentTime = 0; // Reset to the start
            }
        });

        // Play the selected audio
        audioElement.style.display = 'block'; // Show the hidden audio control
        audioElement.play();
    }

    document.getElementById('create-video').addEventListener('click', function() {
        const form = document.getElementById('video-audio-form');
        const videoSelected = form.querySelector('input[name="video"]:checked');
        const audioSelected = form.querySelector('input[name="audio"]:checked');

        // Check if both video and audio are selected
        if (!videoSelected || !audioSelected) {
            alert("Please select both a video and an audio file.");
            return;
        }

        // Popup confirmation: Continue or Cancel
        const userConfirmed = confirm("Video and audio selected. Do you want to continue?");
        if (!userConfirmed) {
            return;  // User chose 'Cancel', stop the process
        }

        // Prepare form data manually to ensure video and audio are sent properly
        const formData = new FormData();
        formData.append('video', videoSelected.value);
        formData.append('audio', audioSelected.value);

        // Perform fetch request
        fetch('/combine', {
            method: 'POST',
            body: formData
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                document.getElementById('output-video-section').innerHTML = `
                    <h3>Combined Video:</h3>
                    <video width="300" height="auto" controls style="border-radius: 6px; border: 1px solid var(--border-color); background: #000;">
                        <source src="${data.output_video}" type="video/mp4">
                        Your browser does not support the video tag.
                    </video>
                `;
            } else {
                alert(data.error);
            }
        })
        .catch(error => {
            alert('Error occurred during video processing.');
            console.error('Error:', error);
        });
    });
</script>

</body>
</html>
