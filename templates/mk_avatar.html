<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="0; url=/upload_media">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting to Avatar Studio</title>
    <link rel="stylesheet" href="/static/css/dark.css">
    <style>
        body {
            background-color: #0d0e15;
            color: #e2e8f0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 80vh;
            margin: 0;
            text-align: center;
        }
        .redirect-box {
            background: rgba(22, 24, 38, 0.95);
            border: 1px solid rgba(0, 240, 255, 0.25);
            border-radius: 12px;
            padding: 2.5rem;
            max-width: 500px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
        h1 {
            color: #00f0ff;
            font-size: 1.6rem;
            margin-top: 0;
        }
        p {
            color: #94a3b8;
            line-height: 1.6;
        }
        a.btn {
            display: inline-block;
            margin-top: 1rem;
            background: linear-gradient(135deg, #00f0ff, #7000ff);
            color: #ffffff;
            text-decoration: none;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="redirect-box">
        <h1>🎭 Redirecting to Avatar Studio...</h1>
        <p>The obsolete <code>mk_avatar.html</code> interface has been superseded by the unified <strong>Avatar Studio</strong>.</p>
        <a href="/upload_media" class="btn">Open Avatar Studio ↗</a>
    </div>
</body>
</html>
