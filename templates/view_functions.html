<!-- view_functions.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>View Functions</title>
    <style>
        body {
            background-color: #111;
            color: #eee;
            font-family: Arial, Helvetica, sans-serif;
            padding: 30px;
        }

        h1 {
            color: #66ccff;
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: #1b1b1b;
        }

        th, td {
            border: 1px solid #333;
            padding: 10px;
            text-align: left;
            vertical-align: top;
            font-size: 14px;
        }

        th {
            background-color: #222;
            color: #66ccff;
        }

        tr:nth-child(even) {
            background-color: #181818;
        }

        tr:hover {
            background-color: #262626;
        }

        .empty {
            color: #999;
            margin-top: 20px;
        }

        a {
            display: inline-block;
            margin-top: 25px;
            color: #66ccff;
            text-decoration: none;
            font-size: 16px;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <h1>Stored Functions</h1>
    <a href="/">HOME</a>
    {% if data and data|length > 0 %}
        <table>
            <thead>
                <tr>
                    {% for col in range(data[0]|length) %}
                        <th>Column {{ loop.index }}</th>
                    {% endfor %}
                </tr>
            </thead>
            <tbody>
                {% for row in data %}
                    <tr>
                        {% for cell in row %}
                            <td>{{ cell }}</td>
                        {% endfor %}
                    </tr>
                {% endfor %}
            </tbody>
        </table>
    {% else %}
        <div class="empty">No functions found.</div>
    {% endif %}



</body>
</html>
