<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KOLBOLB // Avatar Lip-Sync Studio</title>
<style>
  :root {
    --bg: #070a13;
    --panel: #0f172a;
    --panel-border: #1e293b;
    --accent: #00f0ff;
    --accent-glow: rgba(0, 240, 255, 0.35);
    --pink: #ff0055;
    --pink-glow: rgba(255, 0, 85, 0.4);
    --green: #10b981;
    --text: #f1f5f9;
    --muted: #94a3b8;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: radial-gradient(circle at 50% 20%, #131b2e 0%, var(--bg) 100%);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
  }

  header {
    background: rgba(15, 23, 42, 0.85);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--panel-border);
    padding: 12px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .brand h1 {
    font-size: 18px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--accent);
    text-shadow: 0 0 12px var(--accent-glow);
  }

  .brand span {
    font-size: 12px;
    color: var(--muted);
    border: 1px solid #334155;
    padding: 2px 8px;
    border-radius: 4px;
  }

  .nav-links {
    display: flex;
    gap: 12px;
  }

  .nav-btn {
    background: transparent;
    border: 1px solid #334155;
    color: var(--muted);
    padding: 6px 14px;
    border-radius: 6px;
    font-size: 13px;
    text-decoration: none;
    cursor: pointer;
    transition: all 0.2s;
  }

  .nav-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
    box-shadow: 0 0 10px var(--accent-glow);
  }

  .main-layout {
    display: grid;
    grid-template-columns: 1fr 380px;
    gap: 20px;
    padding: 20px;
    max-width: 1500px;
    margin: 0 auto;
    width: 100%;
    flex: 1;
  }

  @media (max-width: 1024px) {
    .main-layout {
      grid-template-columns: 1fr;
    }
  }

  /* Avatar Viewport */
  .stage-container {
    background: #0b0f19;
    border: 1px solid var(--panel-border);
    border-radius: 12px;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    box-shadow: inset 0 0 50px rgba(0,0,0,0.8), 0 10px 30px rgba(0,0,0,0.5);
    overflow: hidden;
  }

  .canvas-wrapper {
    position: relative;
    width: 540px;
    height: 540px;
    max-width: 100%;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 0 30px rgba(0, 240, 255, 0.2), 0 0 60px rgba(0, 0, 0, 0.9);
    border: 2px solid #1e293b;
  }

  #avatarCanvas {
    width: 100%;
    height: 100%;
    display: block;
    background: #000;
  }

  /* CRT Scanline Overlay */
  .crt-overlay {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    pointer-events: none;
    background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
    background-size: 100% 4px, 6px 100%;
    z-index: 10;
  }

  /* HUD Elements */
  .hud-tag {
    position: absolute;
    font-family: monospace;
    font-size: 11px;
    letter-spacing: 1px;
    color: var(--accent);
    z-index: 12;
    pointer-events: none;
    text-shadow: 0 0 6px var(--accent-glow);
  }
  .hud-tl { top: 12px; left: 14px; }
  .hud-tr { top: 12px; right: 14px; text-align: right; }
  .hud-bl { bottom: 12px; left: 14px; }
  .hud-br { bottom: 12px; right: 14px; text-align: right; }

  /* Audio Controls Bar */
  .audio-bar {
    width: 100%;
    margin-top: 18px;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    padding: 14px 18px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .playback-row {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .btn-play {
    background: var(--accent);
    color: #050811;
    border: none;
    padding: 10px 22px;
    border-radius: 8px;
    font-weight: bold;
    font-size: 14px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: all 0.2s;
  }

  .btn-play:hover {
    box-shadow: 0 0 20px var(--accent-glow);
    transform: scale(1.02);
  }

  .btn-secondary {
    background: #1e293b;
    border: 1px solid #334155;
    color: var(--text);
    padding: 10px 16px;
    border-radius: 8px;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .btn-secondary:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  .progress-slider {
    flex: 1;
    height: 6px;
    accent-color: var(--accent);
    cursor: pointer;
  }

  .time-display {
    font-family: monospace;
    font-size: 12px;
    color: var(--muted);
    min-width: 85px;
  }

  /* Control Panel */
  .sidebar {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .card {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 12px;
    padding: 18px;
  }

  .card h3 {
    font-size: 14px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .avatar-select-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(105px, 1fr));
    gap: 10px;
    margin-bottom: 12px;
  }

  .avatar-thumb {
    border: 2px solid #334155;
    border-radius: 8px;
    overflow: hidden;
    cursor: pointer;
    position: relative;
    aspect-ratio: 1;
    transition: all 0.2s;
    background: #000;
  }

  .avatar-thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .avatar-thumb.active {
    border-color: var(--accent);
    box-shadow: 0 0 15px var(--accent-glow);
  }

  .avatar-thumb span {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    background: rgba(0,0,0,0.7);
    font-size: 10px;
    text-align: center;
    padding: 3px 0;
  }

  /* Sliders */
  .control-group {
    margin-bottom: 12px;
  }

  .control-header {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 4px;
  }

  .control-group input[type="range"] {
    width: 100%;
    height: 6px;
    accent-color: var(--accent);
    cursor: pointer;
  }

  /* Viseme Status Monitor */
  .viseme-monitor {
    background: #060912;
    border: 1px solid #1e293b;
    border-radius: 8px;
    padding: 10px 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: monospace;
    font-size: 12px;
    margin-top: 10px;
  }

  .viseme-badge {
    background: var(--pink);
    color: #fff;
    padding: 2px 8px;
    border-radius: 4px;
    font-weight: bold;
    letter-spacing: 1px;
    box-shadow: 0 0 10px var(--pink-glow);
  }

  /* TTS Generator Box */
  .tts-box textarea {
    width: 100%;
    background: #060912;
    border: 1px solid #334155;
    border-radius: 8px;
    color: var(--text);
    padding: 10px;
    font-size: 13px;
    resize: vertical;
    min-height: 60px;
    margin-bottom: 8px;
  }

  .tts-box textarea:focus {
    outline: none;
    border-color: var(--accent);
  }

  .quick-songs {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .song-btn {
    background: #131b2e;
    border: 1px solid #334155;
    color: var(--text);
    padding: 8px 12px;
    border-radius: 6px;
    font-size: 12px;
    text-align: left;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: all 0.2s;
  }

  .song-btn:hover {
    border-color: var(--pink);
    color: var(--pink);
  }

  .song-btn.active {
    border-color: var(--accent);
    background: rgba(0, 240, 255, 0.1);
    color: var(--accent);
  }

  /* Calibration Crosshair Toggle */
  .toggle-label {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--text);
    cursor: pointer;
  /* Spinner Animation */
  @keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }
</style>
</head>

</header>
</body>
</html>
